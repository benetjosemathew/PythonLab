<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Exercise — Submission Viewer</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --border: #e2e4e9; --text: #1c1e21;
    --muted: #6b7280; --accent: #2f6feb; --accent-dark: #1f4fb0;
    --ok: #1a7f37; --ok-bg: #ddf4e4; --err: #b3261e; --err-bg: #fbe9e7;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); padding:24px 16px 64px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  .top p { color:var(--muted); margin:0 0 24px; font-size:0.9rem; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:20px 22px; margin-bottom:18px; }
  .card h2 { font-size:1.05rem; margin:0 0 4px; }
  .card p.desc { color:var(--muted); font-size:0.85rem; margin:0 0 14px; }
  label { display:block; font-size:0.82rem; font-weight:600; margin:10px 0 5px; }
  input[type=text], input[type=password], select {
    width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px;
    font-size:0.9rem; font-family:inherit; background:#fff; color:var(--text);
  }
  button { margin-top:14px; padding:10px 16px; border:none; border-radius:8px;
    background:var(--accent); color:#fff; font-size:0.9rem; font-weight:600; cursor:pointer; }
  button:hover:not(:disabled) { background:var(--accent-dark); }
  button.secondary { background:#fff; color:var(--accent); border:1px solid var(--accent); }
  button:disabled { opacity:0.5; cursor:not-allowed; }
  .status { margin-top:10px; padding:9px 11px; border-radius:8px; font-size:0.85rem; display:none; white-space:pre-wrap; }
  .status.ok { display:block; background:var(--ok-bg); color:var(--ok); }
  .status.err { display:block; background:var(--err-bg); color:var(--err); }
  .status.info { display:block; background:#eef2ff; color:#3730a3; }
  .backBtn { background:#fff; color:var(--muted); border:1px solid var(--border); padding:6px 12px; font-size:0.82rem; font-weight:500; margin-bottom:14px; }
  .meta { font-size:0.83rem; color:var(--muted); margin-top:2px; }
  .meta b { color:var(--text); }
  .actions { display:flex; gap:10px; flex-wrap:wrap; }
  .actions button { margin-top:0; }
  pre.codeView { white-space:pre-wrap; font-size:0.78rem; font-family: ui-monospace, monospace;
    background:#f8f9fb; border:1px solid var(--border); padding:12px; border-radius:8px;
    max-height:520px; overflow:auto; margin-top:14px; }
  .empty { color:var(--muted); font-size:0.85rem; padding:8px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Lab Exercise — Submission Viewer</h1>
    <p>Look up a student's submitted notebook by exercise, view the code, or download the .ipynb.</p>
  </div>

  <!-- ===================== SCREEN: PASSWORD ===================== -->
  <div class="card" id="screenPassword">
    <h2>Admin Access</h2>
    <p class="desc">Kept only in this browser tab for this session — never saved to the page.</p>
    <label for="webappUrl">Web App URL</label>
    <input type="text" id="webappUrl" value="https://script.google.com/macros/s/AKfycbxxBMdL8avDiA1dYTYTWzz7N3fFmA_1G6XcXxG4s0OBHepA5Lh3aacmY6kyAb34bnGW/exec">
    <label for="pwInput">Password</label>
    <input type="password" id="pwInput" placeholder="Enter admin key">
    <button id="pwSubmit">Enter</button>
    <div class="status" id="pwStatus"></div>
  </div>

  <!-- ===================== SCREEN: VIEWER ===================== -->
  <div id="screenViewer" style="display:none;">
    <div class="card">
      <h2>Select submission</h2>
      <label>Exercise</label>
      <select id="exerciseSelect"><option value="">Loading exercises…</option></select>

      <label>Student</label>
      <select id="studentSelect"><option value="">Select an exercise first</option></select>
      <div class="status" id="listStatus"></div>
    </div>

    <div class="card" id="detailCard" style="display:none;">
      <h2 id="detailTitle">—</h2>
      <div class="meta" id="detailMeta"></div>
      <div class="actions">
        <button id="downloadBtn">Download .ipynb</button>
        <button class="secondary" id="toggleCodeBtn">View code</button>
      </div>
      <pre class="codeView" id="codeView" style="display:none;"></pre>
    </div>
  </div>
</div>

<script>
let ADMIN_KEY = "";
let currentSubmissions = []; // submissions for the selected exercise
let currentExerciseId = "";

function webappUrl() { return document.getElementById("webappUrl").value.trim(); }
function setStatus(el, type, msg) { el.className = "status " + type; el.textContent = msg; }

function get(action, extraParams) {
  const params = new URLSearchParams({ action, admin_key: ADMIN_KEY, ...(extraParams || {}) });
  return fetch(`${webappUrl()}?${params.toString()}`).then(r => r.json());
}

// ---- Password gate ----
document.getElementById("pwSubmit").addEventListener("click", () => {
  const statusEl = document.getElementById("pwStatus");
  ADMIN_KEY = document.getElementById("pwInput").value.trim();
  setStatus(statusEl, "info", "Checking…");
  get("checkAdmin").then(data => {
    if (data.error) throw new Error(data.error);
    setStatus(statusEl, "ok", "Access granted.");
    document.getElementById("screenPassword").style.display = "none";
    document.getElementById("screenViewer").style.display = "block";
    loadExerciseList();
  }).catch(err => setStatus(statusEl, "err", "Incorrect password or unreachable: " + err.message));
});

// ---- Exercise list ----
function loadExerciseList() {
  const sel = document.getElementById("exerciseSelect");
  sel.innerHTML = "<option value=''>Loading…</option>";
  get("listExercises").then(data => {
    if (data.error) throw new Error(data.error);
    sel.innerHTML = "<option value=''>Select an exercise…</option>" + data.exercises.map(ex =>
      `<option value="${ex.exercise_id}" ${String(ex.current).toLowerCase() === "yes" ? "selected" : ""}>
        ${ex.exercise_name} (${ex.exercise_id})${String(ex.current).toLowerCase() === "yes" ? " — current" : ""}
      </option>`).join("");
    if (sel.value) sel.dispatchEvent(new Event("change"));
  }).catch(err => { sel.innerHTML = "<option value=''>Failed to load</option>"; console.error(err); });
}

document.getElementById("exerciseSelect").addEventListener("change", () => {
  loadSubmissionsForExercise(document.getElementById("exerciseSelect").value);
});

function loadSubmissionsForExercise(exerciseId) {
  const studentSel = document.getElementById("studentSelect");
  const listStatus = document.getElementById("listStatus");
  document.getElementById("detailCard").style.display = "none";
  currentSubmissions = [];
  currentExerciseId = exerciseId;

  if (!exerciseId) {
    studentSel.innerHTML = "<option value=''>Select an exercise first</option>";
    setStatus(listStatus, "info", "");
    listStatus.style.display = "none";
    return;
  }

  studentSel.innerHTML = "<option value=''>Loading…</option>";
  setStatus(listStatus, "info", "Loading submissions…");

  get("getSubmissionsAdmin", { exercise_id: exerciseId }).then(data => {
    if (data.error) throw new Error(data.error);
    currentSubmissions = data.submissions || [];
    if (!currentSubmissions.length) {
      studentSel.innerHTML = "<option value=''>No submissions yet</option>";
      setStatus(listStatus, "err", "No submissions found for this exercise.");
      return;
    }
    // Sort by roll_no for easy scanning
    currentSubmissions.sort((a, b) => String(a.roll_no).localeCompare(String(b.roll_no), undefined, { numeric: true }));
    studentSel.innerHTML = "<option value=''>Select a student…</option>" + currentSubmissions.map((s, i) =>
      `<option value="${i}">${s.roll_no} — ${s.email}</option>`).join("");
    setStatus(listStatus, "ok", `${currentSubmissions.length} submission(s) found.`);
  }).catch(err => {
    studentSel.innerHTML = "<option value=''>Failed to load</option>";
    setStatus(listStatus, "err", err.message);
  });
}

document.getElementById("studentSelect").addEventListener("change", () => {
  const idx = document.getElementById("studentSelect").value;
  const detailCard = document.getElementById("detailCard");
  const codeView = document.getElementById("codeView");
  codeView.style.display = "none";
  document.getElementById("toggleCodeBtn").textContent = "View code";

  if (idx === "") { detailCard.style.display = "none"; return; }
  const sub = currentSubmissions[idx];
  if (!sub) { detailCard.style.display = "none"; return; }

  document.getElementById("detailTitle").textContent = `${sub.roll_no} — ${sub.email}`;
  const metaParts = [];
  if (sub.submitted_at) metaParts.push(`Submitted: <b>${sub.submitted_at}</b>`);
  metaParts.push(`Exercise: <b>${currentExerciseId}</b>`);
  document.getElementById("detailMeta").innerHTML = metaParts.join(" &nbsp;·&nbsp; ");
  detailCard.style.display = "block";
});

// ---- Code extraction (same logic as admin.html) ----
function extractCode(notebookJsonText) {
  try {
    const nb = JSON.parse(notebookJsonText);
    return nb.cells
      .filter(c => c.cell_type === "code")
      .map((c, i) => `# --- code cell ${i + 1} ---\n` + (Array.isArray(c.source) ? c.source.join("") : c.source))
      .join("\n\n");
  } catch (e) {
    return "[Could not parse notebook JSON: " + e.message + "]";
  }
}

document.getElementById("toggleCodeBtn").addEventListener("click", () => {
  const idx = document.getElementById("studentSelect").value;
  const sub = currentSubmissions[idx];
  if (!sub) return;
  const codeView = document.getElementById("codeView");
  const btn = document.getElementById("toggleCodeBtn");
  if (codeView.style.display === "none") {
    codeView.textContent = extractCode(sub.notebook_json);
    codeView.style.display = "block";
    btn.textContent = "Hide code";
  } else {
    codeView.style.display = "none";
    btn.textContent = "View code";
  }
});

// ---- Download .ipynb ----
document.getElementById("downloadBtn").addEventListener("click", () => {
  const idx = document.getElementById("studentSelect").value;
  const sub = currentSubmissions[idx];
  if (!sub) return;
  let text = sub.notebook_json;
  // Pretty-print if it parses cleanly, so the downloaded file is readable
  try { text = JSON.stringify(JSON.parse(sub.notebook_json), null, 1); } catch (e) { /* fall back to raw */ }
  const blob = new Blob([text], { type: "application/x-ipynb+json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${sub.roll_no || "submission"}_${currentExerciseId}.ipynb`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
